services:
  app:
    build: .
    image: ghcr.io/bsodium/whatsapp-content-moderation:latest
    restart: always
    # Shares the Debian host loopback so host Tailscale Serve can proxy safely.
    network_mode: host
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://127.0.0.1:11434
    volumes:
      # WhatsApp session keys — see docs/decisions.md "auth_info/ is a
      # credential". Back this directory up; losing it means re-linking.
      - ./auth_info:/app/auth_info
      # SQLite audit log / strikes / block records.
      - ./data:/app/data
      # The real moderation policy — gitignored, not baked into the image.
      # Create it first: cp config/policy.example.md config/policy.md
      - ./config/policy.md:/app/config/policy.md:ro
      # tailscaled's local API socket — required only when WEB_CONTROL_PORT
      # is set. The control app calls this instead of trusting a proxy
      # header; see docs/decisions.md "Web control app: replacing the
      # header+token with LocalAPI WhoIs (issue #29 revisited)". Host-side
      # permissions on this socket must allow UID 1000 to connect — verify
      # this before relying on it (see README "Web control app").
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
