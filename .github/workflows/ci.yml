name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Check types
        run: npm run typecheck

      - name: Check frontend types
        run: npm run --prefix web typecheck

      - name: Lint
        run: npm run lint

      - name: Lint frontend
        run: npm run --prefix web lint

      - name: Run tests
        run: npm test

      - name: Run frontend tests
        run: npm run --prefix web test

      - name: Build frontend demo
        run: npm run --prefix web build:demo

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Push-less build — catches a broken Dockerfile on every PR without
      # touching GHCR. The tagged, pushed image only happens in
      # container.yml, triggered directly off a version-tag push.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: whatsapp-content-moderation:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
