<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moderation control</title>
<style>
  :root {
    color-scheme: light dark;
    --color-bg: #ffffff;
    --color-fg: #1a1a1a;
    --color-muted: #6b7280;
    --color-border: #d1d5db;
    --color-accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #16181d;
      --color-fg: #e5e7eb;
      --color-muted: #9ca3af;
      --color-border: #374151;
      --color-accent: #3b82f6;
    }
  }
  * { box-sizing: border-box; }
  body {
    font: 16px/1.5 system-ui, sans-serif;
    max-width: 32rem;
    margin: 2rem auto;
    padding: 0 1rem;
    background: var(--color-bg);
    color: var(--color-fg);
  }
  h1 { font-size: 1.25rem; }
  .status { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; }
  .status dt { font-weight: 600; color: var(--color-muted); }
  .status dd { margin: 0; }
  .row { display: flex; align-items: center; gap: 0.75rem; margin-top: 1.5rem; }
  .actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
  button, select {
    font: inherit;
    padding: 0.5rem 1rem;
    border-radius: 0.375rem;
    border: 1px solid var(--color-border);
    background: var(--color-bg);
    color: var(--color-fg);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--color-accent); }
  button:disabled, .switch:disabled { opacity: 0.5; cursor: default; }
  .switch {
    appearance: none;
    width: 2.5rem;
    height: 1.5rem;
    border-radius: 999px;
    border: 1px solid var(--color-border);
    background: var(--color-border);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }
  .switch::before {
    content: "";
    position: absolute;
    top: 0.1rem;
    left: 0.1rem;
    width: 1.2rem;
    height: 1.2rem;
    border-radius: 50%;
    background: var(--color-bg);
    transition: transform 0.15s ease;
  }
  .switch:checked { background: var(--color-accent); border-color: var(--color-accent); }
  .switch:checked::before { transform: translateX(1rem); }
  #message { margin-top: 1rem; min-height: 1.5em; color: var(--color-muted); }
  @media (max-width: 480px) {
    body { margin: 1rem auto; }
    .actions { flex-direction: column; }
    .actions button { width: 100%; }
  }
</style>
</head>
<body>
  <h1>WhatsApp moderation control</h1>
  <dl class="status" id="status">
    <dt>Strikes</dt><dd data-field="strikeCount">…</dd>
    <dt>Block</dt><dd data-field="block">…</dd>
  </dl>
  <div class="row">
    <input type="checkbox" role="switch" class="switch" id="pause-toggle" />
    <label for="pause-toggle">Paused</label>
  </div>
  <div class="actions">
    <button data-command="unblock">Unblock now</button>
  </div>
  <p id="message"></p>
  <script>
    const statusEl = document.getElementById('status');
    const messageEl = document.getElementById('message');
    const strikeCountEl = statusEl.querySelector('[data-field="strikeCount"]');
    const blockEl = statusEl.querySelector('[data-field="block"]');
    const pauseToggle = document.getElementById('pause-toggle');

    // The token only ever needs to travel in the URL once (the initial
    // link) — persisted to sessionStorage from there, and stripped out of
    // the visible URL/history so it doesn't linger where it could be seen
    // or shared by accident.
    const params = new URLSearchParams(location.search);
    const urlToken = params.get('token');
    if (urlToken) {
      try {
        sessionStorage.setItem('controlToken', urlToken);
      } catch {}
      history.replaceState(null, '', location.pathname);
    }
    const controlToken = urlToken ?? (() => {
      try {
        return sessionStorage.getItem('controlToken');
      } catch {
        return null;
      }
    })();

    function authHeaders(extra = {}) {
      return controlToken ? { 'X-Control-Token': controlToken, ...extra } : extra;
    }

    function render(status) {
      pauseToggle.checked = status.paused;
      strikeCountEl.textContent = status.strikeCount;
      blockEl.textContent = status.block ? `until ${new Date(status.block.unblockAt).toLocaleString()}` : 'not blocked';
    }

    async function runCommand(command) {
      const res = await fetch(`/api/${command}`, {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: '{}',
      });
      const body = await res.json();
      messageEl.textContent = body.message ?? body.error ?? '';
      if (body.paused !== undefined) render(body);
    }

    async function refresh() {
      const res = await fetch('/api/status', { headers: authHeaders() });
      if (res.ok) render(await res.json());
    }

    pauseToggle.addEventListener('change', async () => {
      pauseToggle.disabled = true;
      try {
        await runCommand(pauseToggle.checked ? 'pause' : 'resume');
      } finally {
        pauseToggle.disabled = false;
      }
    });

    document.querySelectorAll('button[data-command]').forEach((button) => {
      button.addEventListener('click', async () => {
        button.disabled = true;
        try {
          await runCommand(button.dataset.command);
        } finally {
          button.disabled = false;
        }
      });
    });

    if (!controlToken) {
      messageEl.textContent = 'No control token — reload using the full link with ?token=... in the URL.';
    } else {
      refresh();
      setInterval(refresh, 5000);
    }
  </script>
</body>
</html>
