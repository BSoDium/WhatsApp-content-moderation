<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moderation control</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <script>
    // The token only ever needs to travel in the URL once (the initial
    // link) — persisted to sessionStorage from there, and stripped out of
    // the visible URL/history so it doesn't linger where it could be seen
    // or shared by accident. Kept inline (not in app.js) so it runs
    // synchronously, before a deferred script could, minimizing how long
    // the raw token sits in the address bar.
    const urlToken = new URLSearchParams(location.search).get('token');
    if (urlToken) {
      try {
        sessionStorage.setItem('controlToken', urlToken);
      } catch {}
      history.replaceState(null, '', location.pathname);
    }
  </script>

  <main class="page">
    <header class="page__header">
      <h1>WhatsApp moderation control</h1>
    </header>

    <div id="card-container"></div>

    <section class="picker" aria-label="Add a contact to monitor">
      <input type="search" id="contact-search" placeholder="Search contacts by name or number…" autocomplete="off" />
      <ul id="contact-results" class="picker__results" role="listbox" hidden></ul>
    </section>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Monitored contacts" hidden></nav>

    <div id="panels"></div>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
